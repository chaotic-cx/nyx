name: "Check PR Trust"
description: "Evaluates if a pull request author is trusted for unsafe checkouts"
outputs:
  is_safe:
    description: "Returns true if the author is trusted"
    value: ${{ steps.trust.outputs.is_safe }}
runs:
  using: "composite"
  steps:
    - name: Evaluate Trust
      id: trust
      uses: actions/github-script@v7
      with:
        script: |
          const isSafeLabel = context.payload.pull_request?.labels?.some(l => l.name === 'safe-to-test') || false;
          const authorAssoc = context.payload.pull_request?.author_association;
          const isTrustedAssoc = ['COLLABORATOR', 'MEMBER', 'OWNER'].includes(authorAssoc);

          let hasWrite = false;
          if (context.eventName === 'pull_request_target') {
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.payload.pull_request.user.login
            });
            hasWrite = (data.permission === 'write' || data.permission === 'admin');
          } else {
            hasWrite = true; // Not a PR target event, inherently trusted by workflow dispatch
          }

          const isSafe = isSafeLabel || isTrustedAssoc || hasWrite;
          core.setOutput('is_safe', isSafe ? 'true' : 'false');
