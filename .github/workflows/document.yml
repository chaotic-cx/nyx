name: Deploy Documentation
on:
  workflow_call:
    outputs:
      built:
        description: "Returns true if the push-pages step succeeded"
        value: ${{ jobs.push-pages.outputs.built }}
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: document
  cancel-in-progress: true

jobs:
  push-pages:
    name: Build and push documentation pages
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      built: ${{ steps.build.outcome == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          extra_nix_config: "accept-flake-config = true"
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build
        id: build
        run: |
          set -euo pipefail
          mkdir result
          nix build --no-link --print-out-paths \
            --override-input chaotic "github:chaotic-cx/nyx/${GITHUB_SHA}" \
            ./maintenance#chaotic-nyx.documentation \
            | \
            xargs -I @ cp @ result/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "result"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
