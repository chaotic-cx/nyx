name: Bump package group
on:
  workflow_call:
    inputs:
      bumpWhat:
        description: What do you want to bump (JSON array)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      bumpWhat:
        description: What do you want to bump (JSON array)
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: group-bump-${{ inputs.bumpWhat }}
  cancel-in-progress: true

jobs:
  group-bump:
    name: Bump package group
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 1440
    steps:
      # identical to build.yml
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
            sandbox-fallback = false
            system-features = big-parallel gccarch-x86-64-v3
          install_options: --daemon
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          persist-credentials: false
      # config to commit
      - name: Bat-signal
        run: |
          set -e
          git config --global user.name 'Chaotic Github Actions'
          git config --global user.email 'actions@chaotic.cx'
      - name: Update and Rebase
        id: update
        run: |
          set -euo pipefail

          # Extract the first package name to use for branches, commits, and PRs
          FIRST_PKG=$(echo "$TARGETPKG" | jq -r '.[0]')
          BRANCH_NAME="bump/${FIRST_PKG}"

          # Create and switch to the bump branch BEFORE running scripts
          # so auto-commits go straight onto this branch
          git checkout -b "$BRANCH_NAME"

          # Record the state of the branch before updates
          START_COMMIT=$(git rev-parse HEAD)

          # Loop through every package in the JSON array and run its update script
          for PKG in $(echo "$TARGETPKG" | jq -r '.[]'); do
            echo "Running updateScript for $PKG..."
            nix build ".#${PKG}.updateScript"
            bash ./result
          done

          # Catch-all: Stage and commit anything if a script didn't auto-commit
          git add -A
          if ! git diff --staged --quiet; then
            echo "Committing unstaged changes..."
            git commit -m "chore: bump ${FIRST_PKG} (and group)"
          fi

          # Check if a push is really necessary
          maintenance/scripts/remote-eq.sh "$BRANCH_NAME" "$START_COMMIT" || conflict=$?
          case $conflict in
            0)
              echo "should_pr=true" >> "$GITHUB_OUTPUT"
              ;;
            42)
              echo "should_pr=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              exit $conflict
              ;;
          esac
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETPKG: ${{ inputs.bumpWhat }}
      - name: Push and PR
        if: steps.update.outputs.should_pr == 'true'
        run: |
          set -euo pipefail

          FIRST_PKG=$(echo "$TARGETPKG" | jq -r '.[0]')
          BRANCH_NAME="bump/${FIRST_PKG}"

          # Use the DEPLOY_KEY for push
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          GIT_SSH_COMMAND="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            git push origin "$BRANCH_NAME" --force
          shred -u ~/.ssh/deploy_key

          # Check if the PR is already open
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --state open --json number | jq length)

          # Create the PR and trigger the merge queue
          if [ "$PR_EXISTS" -eq 0 ]; then
            echo "Creating a new PR for ${FIRST_PKG}..."
            gh pr create \
              --title "chore: bump ${FIRST_PKG}" \
              --body "Automated package bump for \`${TARGETPKG}\`." \
              --head "$BRANCH_NAME" \
              --base main
          else
            echo "PR already exists. It has now been cleanly rebased and updated!"
          fi

          # Trigger auto-merge for the PR using a standard merge commit
          GH_TOKEN="$GH_CI_TOKEN" gh pr merge "$BRANCH_NAME" --auto --rebase
        env:
          GH_TOKEN: ${{ secrets.PAT_CHAOTIC }}
          GH_CI_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          TARGETPKG: ${{ inputs.bumpWhat }}
