name: Unpin
on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

jobs:
  pin-kill:
    name: Unpin orphans
    runs-on: nyxbuilder
    container:
      image: ghcr.io/lucernae/devcontainer-nix:base--nixos-unstable
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Nix
        run: |
          sed -i \
            -e '/^build-users-group =/d' \
            -e 's/max-jobs =.*/max-jobs = 8/g' \
            -e 's/system-features =.*/system-features = benchmark big-parallel gccarch-x86-64-v2 gccarch-x86-64-v3 kvm nixos-test/g' \
            /etc/nix/nix.conf
          nix eval ./maintenance#_dev.nixConfig --json | jq -r 'to_entries[] | "\(.key) = \(.value | join(" "))"' >> /etc/nix/nix.conf
      # similar to build.yml
      - name: Create niks3 auth-token
        run: |
          export XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-$HOME/.config}
          mkdir -p "$XDG_CONFIG_HOME"/niks3/
          printf "%s" "$NIKS3_TOKEN" > "$XDG_CONFIG_HOME"/niks3/auth-token
          wc "$XDG_CONFIG_HOME"/niks3/auth-token
        env:
          NIKS3_TOKEN: ${{ secrets.NIKS3_TOKEN }}
      - name: Diff and save
        run: bash ../../maintenance/scripts/clear-pins.sh --no-dry-run
